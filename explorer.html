<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento — Explorer</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body { min-height: 100vh; }

    header.page-header {
      padding: 24px 20px 12px;
      text-align: center;
    }
    header.page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 4px;
    }
    header.page-header p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .search-wrap { padding: 4px 20px 8px; max-width: 640px; margin: 0 auto; }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { outline: none; border-color: var(--fire); }

    /* ---- Filtres : chips rapides, cumulables, une rangée par critère ---- */
    .filters-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 4px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-group { display: flex; align-items: center; gap: 8px; padding-left: 20px; }
    .filter-group-label {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
      width: 58px;
    }
    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 20px 2px 0;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 13px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: rgba(212, 96, 58, 0.16);
      border-color: var(--fire);
      color: var(--fire);
    }
    .filters-reset {
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: underline;
      margin-left: 20px;
      align-self: flex-start;
      display: none;
    }
    .filters-reset.visible { display: inline-block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      padding: 12px 20px;
      max-width: 640px;
      margin: 0 auto;
    }

    .sauce-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 14px;
      padding: 16px 14px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
    }
    .sauce-card:hover { transform: translateY(-2px); border-color: var(--fire); }
    /* Fiche la mieux documentée (ex-"Gold") : un simple accent, pas un badge à décoder */
    .sauce-card.is-complete { border-left-color: var(--gold); }

    /* Repères d'ingrédients : mêmes formes que le fond de la fiche produit,
       en miniature, pour identifier une sauce au premier coup d'œil dans la grille. */
    .card-ing-bg {
      position: absolute;
      top: 0; right: 0;
      width: 72px;
      height: 72px;
      pointer-events: none;
      z-index: 0;
    }
    .card-ing-bg svg { position: absolute; }
    .sauce-card .name, .sauce-card .brand, .sauce-card .meta { position: relative; z-index: 1; }

    .sauce-card .name {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      line-height: 1.3;
      /* 2 lignes max, pour que la grille reste régulière même avec des noms longs */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sauce-card .brand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .sauce-card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--fire);
    }
    .sauce-card .score {
      color: var(--gold);
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      line-height: 1.7;
    }
    .empty-state a { color: var(--fire); }

    .loading {
      text-align: center;
      padding: 60px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="has-bottom-nav">

  <header class="page-header fade-in">
    <h1>Explorer</h1>
    <p>Le catalogue, une sauce à la fois</p>
  </header>

  <div class="search-wrap">
    <input type="search" id="search-input" class="search-input" placeholder="Chercher une sauce ou une marque…" />
  </div>

  <div id="filters-wrap" class="filters-wrap" style="display:none;">
    <div class="filter-group" data-group="pepper">
      <span class="filter-group-label">Piment</span>
      <div class="chip-row" id="chips-pepper"></div>
    </div>
    <div class="filter-group" data-group="country">
      <span class="filter-group-label">Pays</span>
      <div class="chip-row" id="chips-country"></div>
    </div>
    <div class="filter-group" data-group="flavor">
      <span class="filter-group-label">Saveur</span>
      <div class="chip-row" id="chips-flavor"></div>
    </div>
    <div class="filter-group" data-group="ingredient">
      <span class="filter-group-label">Ingrédient</span>
      <div class="chip-row" id="chips-ingredient"></div>
    </div>
    <button class="filters-reset" id="filters-reset" type="button">Réinitialiser les filtres</button>
  </div>

  <div id="content" class="loading">Chargement…</div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 L12 4 L20 11.5"/><path d="M6 10V19a1 1 0 0 0 1 1H17a1 1 0 0 0 1-1V10"/><path d="M10 20V14H14V20"/></svg></span>Accueil</a>
    <a href="explorer.html" class="active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>Explorer</a>
    <a href="scanner.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1H8"/><path d="M16 4H19a1 1 0 0 1 1 1V8"/><path d="M20 16V19a1 1 0 0 1-1 1H16"/><path d="M8 20H5a1 1 0 0 1-1-1V16"/></svg></span>Scanner</a>
    <a href="cave.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11a7 7 0 0 1 14 0V20"/><path d="M5 20H19"/><path d="M9 20V14"/><path d="M15 20V14"/></svg></span>Cave</a>
    <a href="profil.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg></span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script type="module">
    import { fetchAllSauces } from './sauces.js';
    import { ING_ICONS, matchedIngredientKeys } from './ingredients.js';

    const FLAGS = { MX: '🇲🇽', PA: '🇵🇦', FR: '🇫🇷', US: '🇺🇸', CO: '🇨🇴', ES: '🇪🇸', BZ: '🇧🇿', CA: '🇨🇦', DE: '🇩🇪', HN: '🇭🇳', GT: '🇬🇹', CR: '🇨🇷', SI: '🇸🇮', GB: '🇬🇧' };
    const COUNTRY_NAMES = { MX: 'Mexique', PA: 'Panama', FR: 'France', US: 'États-Unis', CO: 'Colombie', ES: 'Espagne', BZ: 'Belize', CA: 'Canada', DE: 'Allemagne', HN: 'Honduras', GT: 'Guatemala', CR: 'Costa Rica', SI: 'Slovénie', GB: 'Royaume-Uni' };
    const ING_COLORS = ['var(--fire)', 'var(--gold)', 'var(--red)'];

    // Filtres actifs, cumulables entre catégories (ET), et à choix multiple
    // dans une même catégorie (OU) — ex: "Habanero" + "Panama" restreint la
    // liste aux sauces panaméennes à base de habanero.
    const activeFilters = { pepper: new Set(), country: new Set(), flavor: new Set(), ingredient: new Set() };

    function fmtSHU(shu) {
      if (shu == null) return '—';
      if (shu >= 1e6) return (shu / 1e6).toFixed(1) + 'M SHU';
      if (shu >= 1e3) return Math.round(shu / 1e3) + 'k SHU';
      return shu + ' SHU';
    }

    // Petit repère visuel dans le coin de la carte, avec jusqu'à 2 ingrédients
    // réellement détectés dans le texte de la sauce (pas de repli générique ici :
    // mieux vaut une carte neutre qu'une carte qui ment sur son contenu).
    function ingredientBadgeHTML(s) {
      const keys = (s.ingredientKeys || []).slice(0, 2);
      if (!keys.length) return '';
      const shapes = keys.map((key, i) => {
        const shape = (ING_ICONS[key] || ING_ICONS.piment).replaceAll('{c}', ING_COLORS[i] || 'var(--fire)');
        const size = i === 0 ? 52 : 34;
        const pos = i === 0 ? 'top:2px;right:2px;opacity:.22;' : 'top:26px;right:32px;opacity:.16;';
        return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" style="position:absolute;${pos}">${shape}</svg>`;
      }).join('');
      return `<span class="card-ing-bg">${shapes}</span>`;
    }

    function cardHTML(s) {
      const complete = s.tier === 'gold';
      return `
        <a class="sauce-card fade-in${complete ? ' is-complete' : ''}" href="fiche-produit.html?sauce=${encodeURIComponent(s.nameShort)}">
          ${ingredientBadgeHTML(s)}
          <span class="name">${s.nameShort}</span>
          <span class="brand">${s.brandName} ${FLAGS[s.originCountry] || ''}</span>
          <span class="meta">
            <span>${fmtSHU(s.shu)}</span>
            ${s.scoreAvg != null ? `<span class="score">${s.scoreAvg} / 5</span>` : ''}
          </span>
        </a>
      `;
    }

    function normalize(s) {
      return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    function renderList(list) {
      const el = document.getElementById('content');
      if (!list.length) {
        el.className = 'empty-state';
        el.innerHTML = `Aucune sauce ne correspond à ces critères. <a href="explorer.html">Voir tout le catalogue</a>`;
        return;
      }
      el.className = 'grid';
      el.innerHTML = list.map(cardHTML).join('');
    }

    function passesFilters(s) {
      if (activeFilters.pepper.size && !(s.peppers || []).some(p => activeFilters.pepper.has(p))) return false;
      if (activeFilters.country.size && !activeFilters.country.has(s.originCountry)) return false;
      if (activeFilters.flavor.size && !(s.flavorTags || []).some(f => activeFilters.flavor.has(f))) return false;
      if (activeFilters.ingredient.size && !(s.ingredientKeys || []).some(i => activeFilters.ingredient.has(i))) return false;
      return true;
    }

    // Construit les chips d'une catégorie à partir des valeurs réellement
    // présentes dans le catalogue (rien de codé en dur : ça suit la base
    // au fil des prochaines vagues de sauces ajoutées).
    function buildChipGroup(containerId, group, values, labelFor) {
      const container = document.getElementById(containerId);
      const parentGroup = container.closest('.filter-group');
      if (parentGroup) parentGroup.style.display = values.length ? '' : 'none';
      if (!values.length) return;
      container.innerHTML = values.map(v => `<button type="button" class="filter-chip" data-group="${group}" data-value="${encodeURIComponent(v)}">${labelFor ? labelFor(v) : v}</button>`).join('');
      container.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const value = decodeURIComponent(chip.dataset.value);
          const set = activeFilters[group];
          if (set.has(value)) { set.delete(value); chip.classList.remove('active'); }
          else { set.add(value); chip.classList.add('active'); }
          applyAll();
        });
      });
    }

    let allSauces = [];
    function applyAll() {
      const searchInput = document.getElementById('search-input');
      const q = normalize(searchInput.value);
      let list = allSauces.filter(passesFilters);
      if (q) list = list.filter(s => normalize(`${s.brandName} ${s.nameFull} ${s.nameShort}`).includes(q));
      renderList(list);

      const anyActive = Object.values(activeFilters).some(set => set.size > 0);
      document.getElementById('filters-reset').classList.toggle('visible', anyActive);
    }

    (async () => {
      const sauces = await fetchAllSauces();
      const el = document.getElementById('content');
      if (!sauces.length) {
        el.className = 'empty-state';
        el.innerHTML = `
          Aucune sauce à afficher pour l'instant.<br/>
          Si Supabase n'est pas encore configuré, retourne voir <a href="fiche-produit.html">la fiche de démonstration</a> en attendant.
        `;
        return;
      }

      // Ingrédients détectés une seule fois par sauce, réutilisés pour le
      // badge de carte ET pour le filtre "Ingrédient".
      allSauces = sauces.map(s => ({ ...s, ingredientKeys: matchedIngredientKeys(s.ingredientsRaw) }));

      // Valeurs disponibles par catégorie, triées, dérivées du catalogue réel.
      const peppers = [...new Set(allSauces.flatMap(s => s.peppers || []))].sort();
      const countries = [...new Set(allSauces.map(s => s.originCountry).filter(Boolean))].sort();
      const flavors = [...new Set(allSauces.flatMap(s => s.flavorTags || []))].sort();
      const ingredientKeysAll = [...new Set(allSauces.flatMap(s => s.ingredientKeys || []))].sort();

      if (peppers.length || countries.length || flavors.length || ingredientKeysAll.length) {
        document.getElementById('filters-wrap').style.display = '';
        buildChipGroup('chips-pepper', 'pepper', peppers);
        buildChipGroup('chips-country', 'country', countries, c => `${FLAGS[c] || ''} ${COUNTRY_NAMES[c] || c}`);
        buildChipGroup('chips-flavor', 'flavor', flavors);
        buildChipGroup('chips-ingredient', 'ingredient', ingredientKeysAll, k => k.charAt(0).toUpperCase() + k.slice(1));
      }

      document.getElementById('filters-reset').addEventListener('click', () => {
        Object.values(activeFilters).forEach(set => set.clear());
        document.querySelectorAll('.filter-chip.active').forEach(c => c.classList.remove('active'));
        applyAll();
      });

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', applyAll);

      // Préremplit depuis ?q=... (ex: lien "chercher manuellement" du scanner)
      const params = new URLSearchParams(location.search);
      const initialQuery = params.get('q');
      if (initialQuery) {
        searchInput.value = initialQuery;
      }
      applyAll();
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
