<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento — Ma Cave</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body { min-height: 100vh; padding-bottom: 90px; }

    header.page-header { padding: 24px 20px 12px; text-align: center; }
    header.page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 4px;
    }
    header.page-header p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 8px 20px 0; }

    /* ---- État déconnecté ---- */
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
      margin-top: 24px;
    }
    .auth-card .icon-big { width: 40px; height: 40px; margin: 0 auto 16px; color: var(--gold); opacity: 0.8; }
    .auth-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; margin-bottom: 8px; }
    .auth-card p { font-family: 'Outfit', sans-serif; font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
    .cta-primary {
      display: inline-block;
      background: linear-gradient(120deg, var(--fire), var(--red));
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      text-decoration: none;
      padding: 11px 24px;
      border-radius: 999px;
    }

    /* ---- Onglets de statut ---- */
    .tabs-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 16px; scrollbar-width: none; }
    .tabs-row::-webkit-scrollbar { display: none; }
    .tab-chip {
      flex-shrink: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .tab-chip.active { background: rgba(212,96,58,.16); border-color: var(--fire); color: var(--fire); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .sauce-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 14px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sauce-card .name {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .sauce-card .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.8rem; color: var(--muted); }
    .sauce-card .status-tag {
      font-family: 'Outfit', sans-serif;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-top: 4px;
    }
    .sauce-card .rating-tag { color: var(--gold); font-weight: 500; }
    .remove-btn {
      position: absolute;
      top: 10px; right: 10px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
    }
    .remove-btn:hover { border-color: var(--fire); color: var(--fire); }

    .empty-state {
      text-align: center;
      padding: 50px 24px;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      line-height: 1.7;
    }
    .empty-state a { color: var(--fire); }

    .loading {
      text-align: center;
      padding: 60px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="has-bottom-nav">

  <header class="page-header fade-in">
    <h1>Ma Cave</h1>
    <p>Ce que tu as goûté, envisagé, collectionné</p>
  </header>

  <div class="wrap">
    <div id="content" class="loading">Chargement…</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 L12 4 L20 11.5"/><path d="M6 10V19a1 1 0 0 0 1 1H17a1 1 0 0 0 1-1V10"/><path d="M10 20V14H14V20"/></svg></span>Accueil</a>
    <a href="explorer.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>Explorer</a>
    <a href="scanner.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1H8"/><path d="M16 4H19a1 1 0 0 1 1 1V8"/><path d="M20 16V19a1 1 0 0 1-1 1H16"/><path d="M8 20H5a1 1 0 0 1-1-1V16"/></svg></span>Scanner</a>
    <a href="cave.html" class="active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11a7 7 0 0 1 14 0V20"/><path d="M5 20H19"/><path d="M9 20V14"/><path d="M15 20V14"/></svg></span>Cave</a>
    <a href="profil.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg></span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script type="module">
    import { getCurrentUser, fetchUserCollection, removeCollectionEntry } from './auth.js';

    const FLAGS = { MX: '🇲🇽', PA: '🇵🇦', FR: '🇫🇷', US: '🇺🇸', CO: '🇨🇴', ES: '🇪🇸', BZ: '🇧🇿', CA: '🇨🇦', DE: '🇩🇪', HN: '🇭🇳', GT: '🇬🇹', CR: '🇨🇷', SI: '🇸🇮', GB: '🇬🇧' };
    const STATUS_LABELS = { tasted: 'Dégustée', wishlist: 'Envie', collection: 'En Cave' };
    const TABS = [['all', 'Toutes'], ['tasted', 'Dégustées'], ['collection', 'En Cave'], ['wishlist', 'Envies']];

    function renderLoggedOut() {
      const el = document.getElementById('content');
      el.className = '';
      el.innerHTML = `
        <div class="auth-card fade-in">
          <svg class="icon-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11a7 7 0 0 1 14 0V20"/><path d="M5 20H19"/><path d="M9 20V14"/><path d="M15 20V14"/></svg>
          <h2>Connecte-toi pour voir ta Cave</h2>
          <p>Ta collection, tes dégustations et tes envies sont liées à ton compte Ajimento.</p>
          <a class="cta-primary" href="profil.html">Se connecter</a>
        </div>
      `;
    }

    function fmtSHU(shu) {
      if (shu == null) return '—';
      if (shu >= 1e6) return (shu / 1e6).toFixed(1) + 'M SHU';
      if (shu >= 1e3) return Math.round(shu / 1e3) + 'k SHU';
      return shu + ' SHU';
    }

    function cardHTML(item) {
      return `
        <div class="sauce-card fade-in">
          <button class="remove-btn" data-sauce-id="${item.sauceId}" title="Retirer">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg>
          </button>
          <a href="fiche-produit.html?sauce=${encodeURIComponent(item.nameShort)}" style="text-decoration:none;color:inherit;">
            <span class="name">${item.nameShort}</span>
            <span class="brand">${item.brandName} ${FLAGS[item.originCountry] || ''}</span>
            <span class="status-tag">${STATUS_LABELS[item.status] || item.status}${item.rating != null ? ` · <span class="rating-tag">${item.rating}/5</span>` : ''}</span>
          </a>
        </div>
      `;
    }

    let allItems = [];
    let activeTab = 'all';

    function renderList() {
      const el = document.getElementById('content');
      const list = activeTab === 'all' ? allItems : allItems.filter(i => i.status === activeTab);
      const tabsHTML = `<div class="tabs-row">${TABS.map(([key, label]) => `<span class="tab-chip${activeTab === key ? ' active' : ''}" data-tab="${key}">${label}</span>`).join('')}</div>`;

      if (!list.length) {
        el.className = '';
        el.innerHTML = tabsHTML + `<div class="empty-state">Rien ici pour l'instant. <a href="explorer.html">Explore le catalogue</a> pour ajouter une sauce à ta Cave.</div>`;
      } else {
        el.className = '';
        el.innerHTML = tabsHTML + `<div class="grid">${list.map(cardHTML).join('')}</div>`;
      }

      document.querySelectorAll('.tab-chip').forEach(chip => {
        chip.addEventListener('click', () => { activeTab = chip.dataset.tab; renderList(); });
      });
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          const sauceId = btn.dataset.sauceId;
          const user = await getCurrentUser();
          if (!user) return;
          await removeCollectionEntry(user.id, sauceId);
          allItems = allItems.filter(i => i.sauceId !== sauceId);
          renderList();
        });
      });
    }

    (async () => {
      const user = await getCurrentUser();
      if (!user) { renderLoggedOut(); return; }
      allItems = await fetchUserCollection(user.id);
      renderList();
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
