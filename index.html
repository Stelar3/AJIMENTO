<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento</title>

  <!-- PWA : ce qui permet "d'installer" l'app sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />

  <!-- Réglages spécifiques iPhone pour que l'ajout à l'écran d'accueil ressemble à une vraie app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ajimento" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    /* Fond atmosphérique : dégradés + piments qui flottent doucement */
    .home-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 25% 25%, #3D0800 0%, #0A0404 55%, #030303 100%),
        radial-gradient(ellipse at 78% 75%, #C0392B22 0%, transparent 65%);
      z-index: 0;
    }
    .content { position: relative; z-index: 1; }

    .badge {
      display: inline-block;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 28px;
      font-family: 'DM Mono', monospace;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 3.4rem;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-bottom: 10px;
    }
    p.tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 44px;
    }
    .demo-link {
      display: inline-block;
      color: var(--fire);
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .demo-link:hover { border-bottom-color: var(--fire); }

    footer {
      position: fixed;
      bottom: 20px;
      z-index: 1;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body class="has-bottom-nav">
  <div class="home-bg">
    <div class="ingredient" style="left:8%;top:12%;font-size:90px;opacity:.12;--r:-20deg;transform:rotate(-20deg);animation-delay:0s;">🌶️</div>
    <div class="ingredient" style="left:74%;top:15%;font-size:70px;opacity:.1;--r:15deg;transform:rotate(15deg);animation-delay:1.5s;">🌶️</div>
    <div class="ingredient" style="left:70%;top:68%;font-size:80px;opacity:.1;--r:-10deg;transform:rotate(-10deg);animation-delay:3s;">🍾</div>
    <div class="ingredient" style="left:6%;top:70%;font-size:60px;opacity:.09;--r:20deg;transform:rotate(20deg);animation-delay:2s;">🌶️</div>
  </div>

  <div class="content fade-in">
    <div class="badge">Premier test</div>
    <h1>Ajimento</h1>
    <p class="tagline">Every drop has a story</p>
    <a class="demo-link" href="explorer.html">Découvrir le catalogue →</a>
  </div>

  <footer>V0.0.3 · CONSTRUIT LE 28 JUILLET 2026</footer>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><span class="icon">🏠</span>Accueil</a>
    <a href="explorer.html"><span class="icon">🔍</span>Explorer</a>
    <a href="cave.html"><span class="icon">🗄️</span>Cave</a>
    <a href="profil.html"><span class="icon">👤</span>Profil</a>
  </nav>

  <script>
    // Ceci enregistre le "service worker", la pièce technique qui permet
    // à l'app de fonctionner comme une vraie application une fois installée.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.log('Service worker non enregistré :', err);
        });
      });
    }
  </script>
</body>
</html>
