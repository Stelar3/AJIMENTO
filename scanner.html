<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento — Scanner</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body { padding-bottom: 0; }

    .scan-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .scan-topbar h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.3rem;
    }
    .back-link {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
    }

    .scan-viewport {
      position: relative;
      height: min(50vh, 380px);
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #scan-video { width: 100%; height: 100%; object-fit: cover; }

    .scan-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .scan-frame svg {
      width: 78%;
      max-width: 300px;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(0,0,0,.6));
    }

    .scan-permission {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 30%, #2D0800 0%, #0A0404 60%, #030303 100%);
    }
    .scan-permission svg { width: 44px; height: 44px; color: var(--gold); opacity: .6; }
    .scan-permission p {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 260px;
      line-height: 1.6;
    }
    .scan-permission button {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      color: #fff;
      background: linear-gradient(120deg, var(--fire), var(--red));
      border: none;
      padding: 11px 24px;
      border-radius: 999px;
      cursor: pointer;
    }

    .scan-controls { display: flex; justify-content: center; padding: 18px 0 8px; }
    .capture-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 3px solid var(--text);
      background: transparent;
      position: relative;
      cursor: pointer;
      padding: 0;
    }
    .capture-btn::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--fire);
      transition: opacity 0.15s;
    }
    .capture-btn:disabled { opacity: 0.35; cursor: default; }

    .scan-status-bar { padding: 6px 24px 24px; text-align: center; }
    .scan-status-bar p {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      min-height: 1.4em;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .scan-status-bar .cta {
      display: inline-block;
      color: var(--fire);
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      text-decoration: none;
      border-bottom: 1px solid var(--fire);
      padding-bottom: 2px;
    }

    .scan-results { margin: 0 0 16px; text-align: left; }
    .match-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      margin-bottom: 8px;
    }
    .match-card:hover { border-color: var(--fire); }
    .match-card .name { font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 0.9rem; }
    .match-card .brand { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body class="has-bottom-nav">

  <div class="scan-topbar">
    <a class="back-link" href="index.html">← Accueil</a>
    <h1>Scanner</h1>
    <span style="width:60px;"></span>
  </div>

  <div class="scan-viewport" id="scan-viewport">
    <video id="scan-video" autoplay playsinline muted></video>
    <canvas id="scan-canvas" style="display:none;"></canvas>

    <div class="scan-frame" id="scan-frame">
      <svg viewBox="0 0 100 60" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round">
        <path d="M4 16V6a2 2 0 0 1 2-2h10" />
        <path d="M84 4h10a2 2 0 0 1 2 2v10" />
        <path d="M96 44v10a2 2 0 0 1-2 2H84" />
        <path d="M16 56H6a2 2 0 0 1-2-2V44" />
      </svg>
    </div>

    <div class="scan-permission" id="scan-permission" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8V5a1 1 0 0 1 1-1H8" />
        <path d="M16 4H19a1 1 0 0 1 1 1V8" />
        <path d="M20 16V19a1 1 0 0 1-1 1H16" />
        <path d="M8 20H5a1 1 0 0 1-1-1V16" />
      </svg>
      <p id="scan-permission-text">Ajimento a besoin de ta caméra pour photographier l'étiquette.</p>
      <button id="btn-enable-camera">Activer la caméra</button>
    </div>
  </div>

  <div class="scan-controls">
    <button class="capture-btn" id="btn-capture" aria-label="Prendre la photo de l'étiquette" disabled></button>
  </div>

  <div class="scan-status-bar">
    <p id="scan-status-text">Cadre l'étiquette, puis prends la photo.</p>
    <div class="scan-results" id="scan-results" style="display:none;"></div>
    <a class="cta" id="manual-search-link" href="explorer.html">Chercher une sauce manuellement →</a>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 L12 4 L20 11.5"/><path d="M6 10V19a1 1 0 0 0 1 1H17a1 1 0 0 0 1-1V10"/><path d="M10 20V14H14V20"/></svg></span>Accueil</a>
    <a href="explorer.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>Explorer</a>
    <a href="scanner.html" class="active"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1H8"/><path d="M16 4H19a1 1 0 0 1 1 1V8"/><path d="M20 16V19a1 1 0 0 1-1 1H16"/><path d="M8 20H5a1 1 0 0 1-1-1V16"/></svg></span>Scanner</a>
    <a href="cave.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11a7 7 0 0 1 14 0V20"/><path d="M5 20H19"/><path d="M9 20V14"/><path d="M15 20V14"/></svg></span>Cave</a>
    <a href="profil.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg></span>Profil</a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
  <script src="config.js"></script>
  <script type="module">
    import { matchSaucesByLabelText } from './sauces.js';

    const video = document.getElementById('scan-video');
    const canvas = document.getElementById('scan-canvas');
    const captureBtn = document.getElementById('btn-capture');
    const statusText = document.getElementById('scan-status-text');
    const resultsBlock = document.getElementById('scan-results');
    const permissionBlock = document.getElementById('scan-permission');
    const frame = document.getElementById('scan-frame');
    const manualLink = document.getElementById('manual-search-link');

    function setStatus(t) { statusText.textContent = t; }

    const permissionText = document.getElementById('scan-permission-text');

    // Messages différents selon la vraie cause — un refus de permission ne se
    // corrige pas en recliquant sur le bouton, il faut aller dans les réglages
    // du navigateur. Sans ça, "rien ne se passe" au deuxième clic est normal
    // (le navigateur ne réaffiche pas sa popup une fois la permission refusée).
    function permissionMessageFor(err) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return "Ce navigateur ne permet pas d'accéder à la caméra ici. Essaie dans Safari ou Chrome directement (pas dans une appli tierce), ou vérifie que le site est bien en https.";
      }
      switch (err && err.name) {
        case 'NotAllowedError':
        case 'PermissionDeniedError':
          return "La caméra a été bloquée pour ce site. Ouvre les réglages du navigateur (l'icône ⓘ ou le cadenas à côté de l'adresse, ou Réglages → Safari/Chrome → Caméra sur iPhone), autorise la caméra pour ajimento, puis recharge la page.";
        case 'NotFoundError':
        case 'DevicesNotFoundError':
          return "Aucune caméra détectée sur cet appareil.";
        case 'NotReadableError':
        case 'TrackStartError':
          return "La caméra semble utilisée par une autre application. Ferme les autres apps qui pourraient l'utiliser puis réessaie.";
        default:
          return "Impossible d'accéder à la caméra. Vérifie les autorisations du site puis réessaie.";
      }
    }

    async function startCamera() {
      permissionBlock.style.display = 'none';
      setStatus('Autorisation de la caméra…');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        // Attendre que la vidéo ait vraiment ses dimensions avant d'autoriser
        // la capture — sinon un clic trop rapide capture une image vide
        // (largeur/hauteur à 0), et l'OCR renvoie du bruit illisible.
        if (video.readyState < 2) {
          await new Promise((resolve) => video.addEventListener('loadedmetadata', resolve, { once: true }));
        }
        frame.style.display = '';
        captureBtn.disabled = false;
        setStatus("Cadre l'étiquette, puis prends la photo.");
      } catch (err) {
        console.warn('Ajimento: caméra indisponible.', err);
        frame.style.display = 'none';
        captureBtn.disabled = true;
        permissionText.textContent = permissionMessageFor(err);
        permissionBlock.style.display = 'flex';
        setStatus('');
      }
    }

    function renderResults(candidates, ocrTextForFallback) {
      if (!candidates.length) {
        const preview = ocrTextForFallback.length > 60 ? ocrTextForFallback.slice(0, 60) + '…' : ocrTextForFallback;
        setStatus(ocrTextForFallback
          ? `Aucune sauce reconnue à partir de « ${preview} ».`
          : "Rien de lisible sur cette photo — réessaie avec un cadrage plus net.");
        resultsBlock.style.display = 'none';
        manualLink.href = 'explorer.html' + (ocrTextForFallback ? '?q=' + encodeURIComponent(ocrTextForFallback.slice(0, 40)) : '');
        return;
      }
      setStatus(candidates.length === 1 ? 'Une correspondance possible :' : `${candidates.length} correspondances possibles :`);
      resultsBlock.innerHTML = candidates.map(s => `
        <a class="match-card" href="fiche-produit.html?sauce=${encodeURIComponent(s.nameShort)}">
          <span class="name">${s.nameShort}</span>
          <span class="brand">${s.brandName || ''}</span>
        </a>
      `).join('');
      resultsBlock.style.display = 'block';
      manualLink.href = 'explorer.html?q=' + encodeURIComponent(ocrTextForFallback.slice(0, 40));
    }

    // Éclaircit le travail de l'OCR : on ne lui donne que la zone cadrée par
    // le viseur (pas tout le décor autour), convertie en niveaux de gris avec
    // un contraste renforcé — deux techniques classiques qui améliorent
    // nettement la lecture de texte sur fond photo, par rapport à une image
    // couleur brute.
    function prepareCanvasForOcr() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cropW = vw * 0.8;
      const cropH = vh * 0.45;
      const cropX = (vw - cropW) / 2;
      const cropY = (vh - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const imageData = ctx.getImageData(0, 0, cropW, cropH);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const contrasted = Math.min(255, Math.max(0, (gray - 128) * 1.6 + 128));
        d[i] = d[i + 1] = d[i + 2] = contrasted;
      }
      ctx.putImageData(imageData, 0, 0);
    }

    captureBtn.addEventListener('click', async () => {
      if (typeof Tesseract === 'undefined') {
        setStatus("La lecture de l'étiquette n'a pas pu se charger. Vérifie ta connexion et réessaie.");
        return;
      }
      if (!video.videoWidth || !video.videoHeight) {
        setStatus("La caméra n'est pas encore prête — attends une seconde puis réessaie.");
        return;
      }
      captureBtn.disabled = true;
      resultsBlock.style.display = 'none';
      setStatus("Lecture de l'étiquette…");

      prepareCanvasForOcr();

      try {
        const { data } = await Tesseract.recognize(canvas, 'eng', {
          tessedit_pageseg_mode: '11', // "sparse text" : mieux adapté à une étiquette qu'à un paragraphe
        });
        const cleaned = (data.text || '').replace(/\s+/g, ' ').trim();
        const candidates = cleaned ? await matchSaucesByLabelText(cleaned) : [];
        renderResults(candidates, cleaned);
      } catch (err) {
        console.warn('Ajimento: lecture impossible.', err);
        setStatus("La lecture n'a pas fonctionné. Réessaie avec une photo plus nette, ou cherche manuellement.");
      }
      captureBtn.disabled = false;
    });

    document.getElementById('btn-enable-camera').addEventListener('click', startCamera);

    if (location.protocol === 'https:' || location.hostname === 'localhost') {
      startCamera();
    } else {
      setStatus('La caméra nécessite une connexion sécurisée (HTTPS).');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
