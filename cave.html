<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento — Ma Cave</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .icon-big {
      font-size: 3rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 320px;
      margin-bottom: 28px;
    }
    .cta {
      display: inline-block;
      color: var(--fire);
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      text-decoration: none;
      border-bottom: 1px solid var(--fire);
      padding-bottom: 2px;
    }
    .soon {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 18px;
      display: inline-block;
    }
  </style>
</head>
<body class="has-bottom-nav">

  <div class="fade-in">
    <div class="icon-big">🗄️</div>
    <span class="soon">Bientôt</span>
    <h1>Ma Cave</h1>
    <p>
      Ta collection personnelle de sauces goûtées, notées et classées
      arrivera ici dès que les comptes Ajimento seront ouverts.
    </p>
    <a class="cta" href="explorer.html">Explorer le catalogue en attendant →</a>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span>Accueil</a>
    <a href="explorer.html"><span class="icon">🔍</span>Explorer</a>
    <a href="cave.html" class="active"><span class="icon">🗄️</span>Cave</a>
    <a href="profil.html"><span class="icon">👤</span>Profil</a>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
