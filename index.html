<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento</title>

  <!-- PWA : ce qui permet "d'installer" l'app sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />

  <!-- Réglages spécifiques iPhone pour que l'ajout à l'écran d'accueil ressemble à une vraie app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ajimento" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 24px 24px;
      position: relative;
      overflow-x: hidden;
    }
    /* Fond atmosphérique : dégradés + piments qui flottent doucement */
    .home-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 25% 25%, #3D0800 0%, #0A0404 55%, #030303 100%),
        radial-gradient(ellipse at 78% 75%, #C0392B22 0%, transparent 65%);
      z-index: 0;
    }
    .content { position: relative; z-index: 1; width: 100%; max-width: 380px; }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 8px;
    }
    p.tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ---- Stats réelles (nombre de sauces / pays cataloguées) ---- */
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-bottom: 32px;
      min-height: 40px;
    }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat .n {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--fire);
    }
    .stat .l {
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ---- Sauce du moment (tirée de la vraie base) ---- */
    .featured-label {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .featured-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      text-decoration: none;
      color: var(--text);
      text-align: left;
      margin-bottom: 28px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .featured-card:hover { transform: translateY(-2px); border-color: var(--fire); }
    .featured-card .fname {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 2px;
    }
    .featured-card .fbrand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .featured-card .fmeta {
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      color: var(--fire);
    }

    .cta-primary {
      display: inline-block;
      background: linear-gradient(120deg, var(--fire), var(--red));
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 13px 32px;
      border-radius: 999px;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body class="has-bottom-nav">
  <div class="home-bg">
    <div class="ingredient" style="left:8%;top:12%;font-size:90px;opacity:.12;--r:-20deg;transform:rotate(-20deg);animation-delay:0s;">🌶️</div>
    <div class="ingredient" style="left:74%;top:15%;font-size:70px;opacity:.1;--r:15deg;transform:rotate(15deg);animation-delay:1.5s;">🌶️</div>
    <div class="ingredient" style="left:70%;top:68%;font-size:80px;opacity:.1;--r:-10deg;transform:rotate(-10deg);animation-delay:3s;">🍾</div>
    <div class="ingredient" style="left:6%;top:70%;font-size:60px;opacity:.09;--r:20deg;transform:rotate(20deg);animation-delay:2s;">🌶️</div>
  </div>

  <div class="content fade-in">
    <h1>Ajimento</h1>
    <p class="tagline">Every drop has a story</p>

    <div class="stats-row" id="stats-row"></div>

    <div id="featured-block" style="display:none;">
      <div class="featured-label">Sauce du moment</div>
      <a class="featured-card" id="featured-card" href="explorer.html">
        <div class="fname" id="featured-name"></div>
        <div class="fbrand" id="featured-brand"></div>
        <div class="fmeta" id="featured-meta"></div>
      </a>
    </div>

    <a class="cta-primary" href="explorer.html">Explorer le catalogue</a>
  </div>

  <footer>V0.0.4 · CONSTRUIT LE 29 JUILLET 2026</footer>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><span class="icon">🏠</span>Accueil</a>
    <a href="explorer.html"><span class="icon">🔍</span>Explorer</a>
    <a href="cave.html"><span class="icon">🗄️</span>Cave</a>
    <a href="profil.html"><span class="icon">👤</span>Profil</a>
  </nav>

  <script src="config.js"></script>
  <script type="module">
    import { fetchAllSauces } from './sauces.js';

    const FLAGS = { MX: '🇲🇽', PA: '🇵🇦', FR: '🇫🇷', US: '🇺🇸', CO: '🇨🇴', ES: '🇪🇸', BZ: '🇧🇿' };

    function fmtSHU(shu) {
      if (shu == null) return 'Pas encore de donnée';
      if (shu >= 1e6) return (shu / 1e6).toFixed(1) + 'M SHU';
      if (shu >= 1e3) return Math.round(shu / 1e3) + 'k SHU';
      return shu + ' SHU';
    }

    (async () => {
      const sauces = await fetchAllSauces();
      const statsRow = document.getElementById('stats-row');

      if (!sauces.length) {
        // Pas encore de données réelles : on garde une accroche simple, sans faux chiffres
        statsRow.innerHTML = `
          <div class="stat"><span class="n">—</span><span class="l">sauces</span></div>
          <div class="stat"><span class="n">—</span><span class="l">pays</span></div>
        `;
        return;
      }

      const countries = new Set(sauces.map(s => s.originCountry).filter(Boolean));
      statsRow.innerHTML = `
        <div class="stat"><span class="n">${sauces.length}</span><span class="l">sauces</span></div>
        <div class="stat"><span class="n">${countries.size}</span><span class="l">pays</span></div>
      `;

      // Sauce mise en avant : priorité aux fiches Gold, sinon la plus récente
      const featured = sauces.find(s => s.tier === 'gold') || sauces[0];
      if (featured) {
        document.getElementById('featured-name').textContent = featured.nameFull;
        document.getElementById('featured-brand').textContent =
          `${featured.brandName} · ${FLAGS[featured.originCountry] || ''}`;
        document.getElementById('featured-meta').textContent = fmtSHU(featured.shu);
        document.getElementById('featured-card').href =
          `fiche-produit.html?sauce=${encodeURIComponent(featured.nameShort)}`;
        document.getElementById('featured-block').style.display = '';
      }
    })();

    // Ceci enregistre le "service worker", la pièce technique qui permet
    // à l'app de fonctionner comme une vraie application une fois installée.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.log('Service worker non enregistré :', err);
        });
      });
    }
  </script>
</body>
</html>
