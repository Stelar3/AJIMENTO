<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ajimento</title>

  <!-- PWA : ce qui permet "d'installer" l'app sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0A0909" />

  <!-- Réglages spécifiques iPhone pour que l'ajout à l'écran d'accueil ressemble à une vraie app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ajimento" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 48px 24px 24px;
      position: relative;
      overflow-x: hidden;
    }
    /* Fond atmosphérique : dégradés + piments qui flottent doucement */
    .home-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 25% 25%, #3D0800 0%, #0A0404 55%, #030303 100%),
        radial-gradient(ellipse at 78% 75%, #C0392B22 0%, transparent 65%);
      z-index: 0;
    }
    .content { position: relative; z-index: 1; width: 100%; max-width: 380px; }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 12px;
    }
    p.tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ---- Stats réelles (nombre de sauces / pays cataloguées) ---- */
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-bottom: 32px;
      min-height: 40px;
    }
    .stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
    .stat .n {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--fire);
    }
    .stat .l {
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ---- Sauce du moment (tirée de la vraie base) ---- */
    .featured-label {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .featured-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      text-decoration: none;
      color: var(--text);
      text-align: left;
      margin-bottom: 28px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .featured-card:hover { transform: translateY(-2px); border-color: var(--fire); }
    .featured-card .fname {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 2px;
    }
    .featured-card .fbrand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .featured-card .fmeta {
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      color: var(--fire);
    }

    .cta-primary {
      display: inline-block;
      background: linear-gradient(120deg, var(--fire), var(--red));
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 13px 32px;
      border-radius: 999px;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body class="has-bottom-nav">
  <div class="home-bg">
    <div class="ingredient" style="left:8%;top:12%;width:90px;height:90px;opacity:.14;--r:-20deg;transform:rotate(-20deg);animation-delay:0s;">
      <svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 6C40 20 50 30 50 42C50 52 42 58 32 58C22 58 14 52 14 42C14 30 24 20 32 6Z" fill="var(--fire)"/></svg>
    </div>
    <div class="ingredient" style="left:74%;top:15%;width:60px;height:60px;opacity:.1;--r:15deg;transform:rotate(15deg);animation-delay:1.5s;">
      <svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 6C40 20 50 30 50 42C50 52 42 58 32 58C22 58 14 52 14 42C14 30 24 20 32 6Z" fill="var(--gold)"/></svg>
    </div>
    <div class="ingredient" style="left:70%;top:68%;width:75px;height:75px;opacity:.1;--r:-10deg;transform:rotate(-10deg);animation-delay:3s;">
      <svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 6C40 20 50 30 50 42C50 52 42 58 32 58C22 58 14 52 14 42C14 30 24 20 32 6Z" fill="var(--red)"/></svg>
    </div>
    <div class="ingredient" style="left:6%;top:70%;width:50px;height:50px;opacity:.09;--r:20deg;transform:rotate(20deg);animation-delay:2s;">
      <svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 6C40 20 50 30 50 42C50 52 42 58 32 58C22 58 14 52 14 42C14 30 24 20 32 6Z" fill="var(--fire)"/></svg>
    </div>
  </div>

  <div class="content fade-in">
    <svg class="logo-mark" width="44" height="44" viewBox="0 0 64 64" style="margin-bottom:14px;">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F5D76E"/>
          <stop offset="45%" stop-color="var(--fire)"/>
          <stop offset="100%" stop-color="var(--red)"/>
        </linearGradient>
      </defs>
      <path d="M32 6 C40 20 50 30 50 42 C50 52 42 58 32 58 C22 58 14 52 14 42 C14 30 24 20 32 6 Z" fill="url(#logoGrad)"/>
      <path d="M32 6 C34 12 33 16 30 18" stroke="#FFF4D6" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <h1>Ajimento</h1>
    <p class="tagline">Every drop has a story</p>

    <div class="stats-row" id="stats-row"></div>

    <div id="featured-block" style="display:none;">
      <div class="featured-label">Sauce du moment</div>
      <a class="featured-card" id="featured-card" href="explorer.html">
        <div class="fname" id="featured-name"></div>
        <div class="fbrand" id="featured-brand"></div>
        <div class="fmeta" id="featured-meta"></div>
      </a>
    </div>

    <a class="cta-primary" href="explorer.html">Explorer le catalogue</a>
  </div>

  <footer>V0.0.4 · CONSTRUIT LE 29 JUILLET 2026</footer>

  <nav class="bottom-nav">

    <a href="explorer.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></span>Explorer</a>
    <a href="scanner.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1H8"/><path d="M16 4H19a1 1 0 0 1 1 1V8"/><path d="M20 16V19a1 1 0 0 1-1 1H16"/><path d="M8 20H5a1 1 0 0 1-1-1V16"/></svg></span>Scanner</a>
    <a href="cave.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11a7 7 0 0 1 14 0V20"/><path d="M5 20H19"/><path d="M9 20V14"/><path d="M15 20V14"/></svg></span>Cave</a>

  </nav>

  <script src="config.js"></script>
  <script type="module">
    import { fetchAllSauces } from './sauces.js';
    import { getCurrentUser, fetchUserStats } from './auth.js';

    const FLAGS = { MX: '🇲🇽', PA: '🇵🇦', FR: '🇫🇷', US: '🇺🇸', CO: '🇨🇴', ES: '🇪🇸', BZ: '🇧🇿' };

    function fmtSHU(shu) {
      if (shu == null) return 'Pas encore de donnée';
      if (shu >= 1e6) return (shu / 1e6).toFixed(1) + 'M SHU';
      if (shu >= 1e3) return Math.round(shu / 1e3) + 'k SHU';
      return shu + ' SHU';
    }

    (async () => {
      const sauces = await fetchAllSauces();
      const statsRow = document.getElementById('stats-row');

      // Dégustations : maintenant que les comptes existent, on affiche le vrai
      // chiffre personnel si l'utilisateur est connecté — sinon on l'annonce
      // honnêtement avec un tiret plutôt que d'inventer un nombre.
      const user = await getCurrentUser();
      const tastedCount = user ? (await fetchUserStats(user.id)).tastedCount : null;
      const degustationsStat = `<div class="stat"><span class="n">${tastedCount ?? '—'}</span><span class="l">dégustations</span></div>`;

      if (!sauces.length) {
        // Pas encore de données réelles : on garde une accroche simple, sans faux chiffres
        statsRow.innerHTML = `
          <div class="stat"><span class="n">—</span><span class="l">sauces</span></div>
          <div class="stat"><span class="n">—</span><span class="l">pays</span></div>
          ${degustationsStat}
        `;
        return;
      }

      const countries = new Set(sauces.map(s => s.originCountry).filter(Boolean));
      statsRow.innerHTML = `
        <div class="stat"><span class="n">${sauces.length}</span><span class="l">sauces</span></div>
        <div class="stat"><span class="n">${countries.size}</span><span class="l">pays</span></div>
        ${degustationsStat}
      `;

      // Sauce mise en avant : priorité aux fiches Gold, sinon la plus récente
      const featured = sauces.find(s => s.tier === 'gold') || sauces[0];
      if (featured) {
        document.getElementById('featured-name').textContent = featured.nameFull;
        document.getElementById('featured-brand').textContent =
          `${featured.brandName} · ${FLAGS[featured.originCountry] || ''}`;
        document.getElementById('featured-meta').textContent = fmtSHU(featured.shu);
        document.getElementById('featured-card').href =
          `fiche-produit.html?sauce=${encodeURIComponent(featured.nameShort)}`;
        document.getElementById('featured-block').style.display = '';
      }
    })();

    // Ceci enregistre le "service worker", la pièce technique qui permet
    // à l'app de fonctionner comme une vraie application une fois installée.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.log('Service worker non enregistré :', err);
        });
      });
    }
  </script>
</body>
</html>
